### Hezhong Skywars 配置文件
### 一个新的单端空岛战争插件
### 作者 tjshawa

# 权限节点：
# 命令：hsw.command

basicInfo:
  # 基本信息配置
  serverIp: "&eHezhong Technology" # 显示用的服务器地址，可填写字符串，解析颜色代码
  serverName: "&e&lExample" # 显示用，服务器名称，解析颜色代码
  lobbyWorld: "world" # 大厅世界
database:
  type: "sqlite" # sqlite / mysql
  host: "127.0.01" # 服务器地址。SQLite则填数据库文件路径，例如HSWDB.db。
  port: 1145 # 服务器端口。SQLite无需填空！
  user: root # 服务器用户（若有），没有则留空。SQLite无需填空！
  password: 114514 # 服务器密码（若有），没有则留空。SQLite无需填空！
  database: "root" # 数据库名
  table-prefix: "hezhongsw" # 数据表前缀
  reconnect-timeout: 5000 # 重连超时，毫秒
