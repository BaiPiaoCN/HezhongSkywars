### Hezhong Skywars 地图设置
# 在配置地图的时候，你也需要配置一个世界重生点。
example_map: # 此处填写地图名
  original_world: "skywars_1" # 此处填写原始世界名。世界存放在./plugins/HezhongSkywars/maps下。
  copy_world: "skywars_1_runtime" # 插件运行时，复制的世界名。此世界运行在服务器中。
  min_players_to_autostart: 4 # 最小自动启动玩家数
  max_players: 12 # 最大玩家数
  countdown: 30 # 开启游戏的倒计时
  ok: false # 此地图是否可用
  spawns: # 玩家出生点
    1:
      x: 0
      y: 100
      z: 0
  chests:
    1:
      x: 0
      y: 50
      z: 0
      type: "normal"
  events:
    1:
      time: 300 # 秒。游戏开始后，多久触发事件？
      type: "resetChest" # 事件类型。resetChest或stopGame

